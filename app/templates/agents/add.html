{% extends "layouts/base.html" %}

{% block title %}
    Add Agent | Freight CRM
{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 0 auto; padding: 10px;">

    <!-- HEADER -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
            <span style="font-size: 11px; font-weight: 800; color: #7f1d1d; letter-spacing: 0.08em; text-transform: uppercase;">Agent Management</span>
            <h2 style="margin: 4px 0 2px; font-size: 24px; font-weight: 800; color: #111827;">Add New Agent</h2>
            <p style="margin: 0; font-size: 13px; color: #6b7280;">Register international freight shipping partners.</p>
        </div>
        <a href="{{ url_for('agents.agent_list') }}" style="display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid #e5e7eb; border-radius: 10px; background: #ffffff; color: #374151; text-decoration: none; font-size: 13px; font-weight: 700;">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <!-- FORM CARD -->
    <form method="POST" action="{{ url_for('agents.add_agent') }}" style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05); overflow: hidden;">
        
        <div style="padding: 24px; border-bottom: 1px solid #eef2f7;">
            <div style="display: flex; gap: 14px; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: #fef2f2; color: #7f1d1d; font-size: 18px; flex-shrink: 0;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <div>
                    <h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 800; color: #111827;">Partner Details</h3>
                    <p style="margin: 0; font-size: 13px; color: #6b7280;">Provide contact info and country designation.</p>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #374151;">Agent Name <span style="color: #b91c1c;">*</span></label>
                    <input type="text" name="name" placeholder="e.g. Global Freight Co." required style="width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #374151;">Email Address <span style="color: #b91c1c;">*</span></label>
                    <input type="email" name="email" placeholder="e.g. agent@example.com" required style="width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #374151;">Country <span style="color: #b91c1c;">*</span></label>
                    <input type="text" name="country" placeholder="e.g. Kuwait / China / Dubai" required style="width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none;">
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px; background: #fafafa;">
            <a href="{{ url_for('agents.agent_list') }}" style="padding: 10px 16px; border: 1px solid #e5e7eb; border-radius: 10px; background: #ffffff; color: #374151; text-decoration: none; font-size: 13px; font-weight: 700;">Cancel</a>
            <button type="submit" style="padding: 10px 20px; border: none; border-radius: 10px; background: #7f1d1d; color: #ffffff; font-size: 13px; font-weight: 800; cursor: pointer;">
                <i class="bi bi-check2-circle"></i> Save Agent
            </button>
        </div>

    </form>
</div>
{% endblock %}
